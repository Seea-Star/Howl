<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Howl's Moving Castle - Cosmic-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* SFONDO PRINCIPALE: Sfumatura morbida dal blu notte all'azzurro cielo */
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 40px 15px;
      font-family: 'Quicksand', sans-serif;
      color: #111111;
      display: flex;
      justify-content: center;
      position: relative;
      background: linear-gradient(to bottom, #1a3a5f 0%, #4a7c9d 50%, #87b2c9 100%);
    }

    /* GRIGLIA A QUADRETTI LEGGERA */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.25) 1px, transparent 1px);
      background-size: 25px 25px;
      pointer-events: none;
      z-index: 0;
    }

    .site-wrapper {
      max-width: 750px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: relative;
      z-index: 1;
    }

    /* LOGO GRANDE IN ALTO */
    .top-banner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
    }

    .top-banner img.logo-img {
      max-width: 420px;
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(3px 3px 0px #111111);
    }

    /* AREA SCRAPBOOK / IMMAGINI E GIF SPARSE */
    .scrapbook-container {
      display: flex;
      flex-direction: column;
      gap: 35px;
      padding: 10px 20px;
    }

    /* Stile per ogni elemento sparso (GIF o Foglio di diario) */
    .scrapbook-item {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .scrapbook-item.right {
      flex-direction: row-reverse;
      text-align: right;
    }

    .scrapbook-item.center {
      justify-content: center;
    }

    /* Immagini con bordo e ombra in stile sticker/polaroid */
    .scrapbook-item img {
      border: 3px solid #111111;
      border-radius: 14px;
      box-shadow: 4px 4px 0px #111111;
      object-fit: cover;
      background: #ffffff;
    }

    /* Dimensioni personalizzabili per le tue GIF e immagini */
    .img-diary {
      max-width: 380px;
      width: 100%;
      height: auto;
      transform: rotate(-1deg);
    }

    .img-large { width: 240px; height: 160px; }
    .img-medium { width: 180px; height: 130px; }
    .img-small { width: 140px; height: 140px; }

    .scrapbook-caption {
      background: #ffffff;
      border: 2px solid #111111;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.8rem;
      box-shadow: 3px 3px 0px #111111;
      display: inline-block;
    }

    /* BOTTONE INDIETRO */
    .back-btn {
      display: inline-block;
      background: #ffffff;
      color: #111111;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      text-align: center;
      border: 3px solid #111;
      box-shadow: 4px 4px 0px #111;
      align-self: center;
      margin-top: 15px;
      transition: transform 0.1s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="site-wrapper">

    <!-- Logo originale grande in alto -->
    <header class="top-banner">
      <img src="howl-logo.png" alt="Howl's Moving Castle" class="logo-img">
    </header>

    <!-- Area dei contenuti sparsi in stile scrapbook -->
    <div class="scrapbook-container">
      
      <!-- Il foglio di diario (che editerai con i disegnini) -->
      <div class="scrapbook-item center">
        <img src="note-paper.png" alt="Note Paper" class="img-diary">
      </div>

      <!-- Prima GIF sparsa -->
      <div class="scrapbook-item">
        <img src="howl-walk.gif" alt="Walking on air" class="img-large">
        <div>
          <span class="scrapbook-caption">Walking on Air ✨</span>
        </div>
      </div>

      <!-- Seconda GIF sparsa (posizionata a destra) -->
      <div class="scrapbook-item right">
        <img src="calcifer-food.gif" alt="Calcifer cooking" class="img-medium">
        <div>
          <span class="scrapbook-caption">Calcifer's Breakfast 🔥</span>
        </div>
      </div>

      <!-- Terza GIF sparsa -->
      <div class="scrapbook-item">
        <img src="howl-room.gif" alt="Howl room" class="img-small">
        <div>
          <span class="scrapbook-caption">The Magic Room 🔮</span>
        </div>
      </div>

    </div>

    <a href="shrines.html" class="back-btn">&larr; BACK TO SHRINES</a>

  </div>

</body>
</html>
